[package]
name = "stardf-materialize"
description = "Snapshot-delta parallel rule derivation over immutable columnar pages"
version = "26.11.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
rust-version = "1.98"

[dependencies]
stardf-datalog = { workspace = true }

[dev-dependencies]
divan = "0.1.21"

[lib]
name = "stardf_materialize"
path = "src/lib.rs"

[[bench]]
name = "derive_bench"
harness = false

[[test]]
name = "parallel_courts"

[lints]
workspace = true
