name: stardf-arrow-reconstitution

on:
  pull_request:
    paths:
      - "stardf/arrow/**"
      - "authority/stardf/**"
  push:
    branches: [main]
    paths:
      - "stardf/arrow/**"
      - "authority/stardf/**"
  workflow_dispatch:

jobs:
  stardf-arrow-reconstitution:
    name: GL-STARDF-001 stardf-arrow reconstitution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact ggen-legacy subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact ggen-legacy checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Assert stardf/arrow subtree present
        shell: bash
        run: |
          set -euo pipefail
          test -f stardf/arrow/Cargo.toml
          test -f stardf/arrow/scripts/verify.py
      - name: Install stardf-arrow toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown,aarch64-unknown-linux-gnu
      - name: Verify selected Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
      - name: Install python verification deps
        run: pip install rdflib
      - name: Execute stardf-arrow workspace baseline
        working-directory: stardf/arrow
        run: cargo test --workspace --locked
      - name: Manufacture deterministic receipt evidence twice
        shell: bash
        working-directory: stardf/arrow
        run: |
          set -euo pipefail
          mkdir -p evidence/receipts/run1 evidence/receipts/run2
          python3 scripts/verify.py --emit-receipt evidence/receipts/run1/receipt.json
          python3 scripts/verify.py --emit-receipt evidence/receipts/run2/receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('evidence/receipts/run1/receipt.json').read_text())
          b = json.loads(Path('evidence/receipts/run2/receipt.json').read_text())
          assert a['receipt_sha256'] == b['receipt_sha256'], (a['receipt_sha256'], b['receipt_sha256'])
          assert a.get('standing') == 'UNKNOWN', a.get('standing')
          assert a['errors'] == [], a['errors']
          assert all(c['passed'] for c in a['checks']), a['checks']
          print(json.dumps({
              'receipt_sha256': a['receipt_sha256'],
              'checks_passed': len(a['checks']),
              'errors': len(a['errors']),
          }, sort_keys=True))
          PY
      - name: Anti-vacuity court (drop-export mutation must FAIL)
        shell: bash
        working-directory: stardf/arrow
        run: |
          set -uo pipefail
          if python3 scripts/verify.py --mutate drop-export; then
            echo "VACUOUS GATE: mutated substrate passed" >&2
            exit 1
          fi
          echo "[PASS] mutation correctly refused."
      - name: Upload stardf-arrow reconstitution evidence
        uses: actions/upload-artifact@v4
        with:
          name: gl-stardf-001-stardf-arrow-${{ github.run_id }}
          path: stardf/arrow/evidence/receipts/
          if-no-files-found: error
          retention-days: 14

