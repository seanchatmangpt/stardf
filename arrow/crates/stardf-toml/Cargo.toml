[package]
name = "stardf-toml"
# Lane 07-publish-metadata (2026-10-31): v26.11.1 first-class closure —
# description/keywords/categories join the workspace inheritance.
description.workspace = true
version.workspace = true
edition.workspace = true
publish = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
documentation = "https://docs.rs/stardf-toml"
keywords.workspace = true
categories.workspace = true
# Lane 10 (2026-10-31): crates.io 10MB tarball ceiling — the toml-test
# conformance corpus (tests/suite, 3.7MB) stays in-tree for `cargo test`,
# excluded from the packaged crate. tests/roundtrip.rs still rides.
exclude = ["tests/suite"]

[lib]
# Vendoring law: lib name upstream-verbatim (package renamed, lib unchanged).
name = "purrdf_toml"

[dependencies]
stardf-core.workspace = true
stardf-lex.workspace = true
stardf-xsd.workspace = true
stardf-hash.workspace = true

[dev-dependencies]
stardf-rdf.workspace = true
stardf-testkit.workspace = true
stardf-sparql-eval.workspace = true

[[test]]
name = "roundtrip"
harness = false

# toml bench lanes: report-only, make bench lane only (wave v26.10.26).
[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
