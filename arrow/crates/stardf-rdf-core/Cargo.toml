harness = false

[[test]]
name = "loss_profiles"
harness = false

[[test]]
name = "pack_certify"
harness = false

[[test]]
name = "segmented"
harness = false

[[test]]
name = "model_traits"
harness = false

[[bench]]
name = "model_traits"
harness = false

[[test]]
name = "dataset_state_digest"
harness = false

[[bench]]
# IR layout / operational-metrics harness: AoS-vs-SoA(-vs-predicate-adjacency)
# iteration + allocated-bytes/count/peak reporting. Satisfies the RFC gate
# "Layout is chosen by benchmark, not asserted". `make bench` lane only — excluded
# from `make check`.
name = "ir_layout"
harness = false

[[bench]]
# Complete-state identity construction over fixed native shapes. Report-only;
# it does not alter or compare any preexisting identity's hot path.
name = "dataset_state_digest"
harness = false

[[bench]]
# COW `MutableDataset` measured-hypothesis harness: the shipped copy-on-
# write suppression-delta dataset benched head-to-head against a simple hash-indexed
# value-quad store, on a build/mutate/query workload. Reports both; asserts no winner.
# `make bench` lane only — excluded from `make check`.
name = "mutable"
harness = false

[[bench]]
# Succinct `pack` primitives: `IntVector::get` and `RankSelect`'s
# `rank1`/`select1`, each at a few sizes.
# Report-only — no timing/speedup assertions. `make bench` lane only — excluded
# from `make check`.
name = "pack_bits"
harness = false

[[bench]]
# Intern-time content-id overhead harness: three groups measuring
# ordinary-IRI interning with content addressing inactive vs active (prefix-miss
# cost) and genuine `blake3:<64hex>` content-id interning (prefix-hit + decode +
# side-table insert). Report-only — no timing/speedup assertions. `make bench`
# lane only — excluded from `make check`.
name = "intern_content_id"
harness = false

[[bench]]
# IR-boundary absoluteness invariant: the intern-time cost of proving every IRI
# term is absolute, split so the store-once claim is readable — all-misses
# (one parse per distinct IRI) vs all-hits (no parse at all) vs a realistic
# reused-vocabulary mix, plus the same worst case on the `GlobalDictionary`
# table. Report-only — no timing/speedup assertions. `make bench` lane only —
# excluded from `make check`.
name = "intern_absoluteness"
harness = false

[[bench]]
# `purrdf_core::csv` read/write throughput over 1 MiB SSSOM-shaped and
# CSVW-shaped inputs. Report-only; no timing threshold is asserted.
name = "csv"
harness = false

[[bench]]
# SSSOM document-layout hot paths: validated column construction and sparse
# deterministic serialization over a retained source layout. Report-only; no
# timing threshold is asserted.
name = "sssom"
harness = false

[[bench]]
# Succinct `pack` codec end-to-end harness: `PackBuilder::build_bytes`
# (encode), `PackView::from_bytes` (open), `quads_for_pattern` over a
# `PackView` for subject/predicate/object-bound and full-scan shapes, and
# `verify_pack` (the certified-projection RDFC-1.0 recompute). Report-only —
# no timing/speedup assertions. `make bench` lane only — excluded from
# `make check`.
name = "pack_query"
harness = false

[[bench]]
# Internal, non-shipped comparison of the pack codec's FoQ posting indexes with
# a pointerless bitmap wavelet-matrix candidate over the existing Sp/So
# sequences. Measures bytes, deterministic build cost, and the three
# unbound-subject query shapes; no winner is asserted.
name = "pack_index_compare"
harness = false

[[bench]]
# Deterministic `.purremb` substantial-fixture harness: full validation and
# resident reopen, target/relation and prefix access, exact/coarse+rerank
# retrieval, bounded-memory streaming output, f64 access, and a one-million-
# chunk catalog. Report-only — no latency or recall threshold is asserted.
name = "purremb"
harness = false

[[bench]]
# One-shot allocation/count/high-water probes over the same deterministic
# `.purremb` fixtures. Kept in a separate process so allocator atomics cannot
# distort the timings above.
name = "purremb_alloc"
harness = false

[[bench]]
# One-shot allocation/count/high-water probes over the pack RESTORE path
# (`PackView::from_bytes`, `dataset_from_view`, and `restore_pack` over both), on an
# RDF 1.1 and an RDF 1.2 fixture. Separate from the `pack_query` timed target so
# the allocator atomics cannot distort its timings, and separate from that target's
# concerns because a decoder that quietly returns to one allocation per term reads as
# noise in a latency measurement and as a scaling count here. Report-only — no
# allocation or timing threshold is asserted. `make bench` lane only — excluded from
# `make check`.
name = "pack_restore_alloc"
harness = false

[[bench]]
# Kernel-level harness (A4 audit): ns/op rows for the four
# `primitives.rs` register kernels over seeded LCG fixtures, plus GB/s
# rows for the CSV field scanner's live dispatch vs the portable SWAR
# kernel over a 1 MiB seeded haystack (full scan, no early exit).
# Report-only -- no timing/speedup assertions. `make bench` lane only --
# excluded from `make check`.
name = "primitives_table"
harness = false

[[bench]]
name = "shared_views"
harness = false

[[bench]]
# COLD cost of the shared XSD/XPath `regExp` translator (`xsd_regex::compile`):
# translation + regex build across structurally distinct shapes (plain ASCII,
# Unicode category, XML-name escapes with and without `i`, first/last Unicode
# block, class subtraction, `x`/`q`). Report-only; `make bench` lane only —
# excluded from `make check`.
name = "xsd_regex"
harness = false

[[bench]]
# The `purrdf_core::distance` kernels -- batch (`distances`), indexed
# (`distances_indexed`), pair (`distance`) and bounded (`distance_bounded`) -- under
# `Exact` and `Reassociated`, over f64xf64 / f64xf32 / f32xf32 width pairs at 384, 768
# and 1536 dimensions. Report-only -- no timing/speedup assertions; the two arithmetics
# are reported side by side. `make bench` lane only -- excluded from `make check`.
name = "distance"
harness = false

[[bench]]
# The two core paths that reach a shared home: the Turtle literal escape scan
# (`turtle::emit_term` over 1 MiB of clean, dense-escape and sparse-escape text)
# and the pack dictionary's front-coding prefix (`EncodedDict::encode`/`decode`
# over 100,000 sorted IRIs, and the `common_prefix_len` kernel). Report-only --
# no timing/speedup assertions. `make bench` lane only -- excluded from `make check`.
name = "shared_homes"
harness = false

[[bench]]
# `purrdf_core::SmallVec` on the workspace's row shapes: `IdVec` push /
# from_slice / collect / clone / into_iter inline and spilled, and dense
# `Option<TermId>` rows built by `smallvec![None; w]`. Report-only -- no
# timing/speedup assertions. `make bench` lane only -- excluded from `make check`.
name = "small"
harness = false

# The CSV field scanner's kernel differential -- the portable oracle, the live
# dispatch and every explicit vector kernel this build compiles -- run through
# the doc-hidden `purrdf_core::csv::backend` module on `purrdf_testkit`'s
# `harness = false` runner. Native Rust runs the full target; `make wasm-test`
# selects the explicit simd128 kernel comparisons and dispatch assertion.
[[test]]
name = "csv_scan_wasm"
harness = false

[[test]]
name = "byte_cover"
harness = false

[[test]]
name = "triple_carrier"
harness = false

[lints]
# Materialized from upstream workspace root [workspace.lints] at the vendored
# rev (the stardf/arrow workspace defines no [workspace.lints] table).
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
single_match_else = "allow"
match_same_arms = "allow"
if_not_else = "allow"
items_after_statements = "allow"
zero_sized_map_values = "allow"
unnecessary_debug_formatting = "allow"
float_cmp = "allow"

