# Copy-sweep lane w2-l01 (2026-10-31): full straight copy of purrdf rev
# 0da0578306983da851a9073337d57e2e2c41ab3a `crates/rdf-core` -> `stardf-rdf-core`,
# landed via `git -C /Users/sac/purrdf archive <rev> crates/rdf-core` (the dirty
# working tree was never read). All 315 files byte-verified against the rev
# (per-file cmp, 315/315 exit 0). Rename scope: `[package] name`, first-party
# dep keys (path deps to arrow-workspace siblings), materialized
# workspace-inherited scalars + external dep RHS + [lints] table (upstream root
# values verbatim). Lib name `purrdf_core` stays VERBATIM per the vendoring law.
# Package name `stardf-rdf-core` (not the vendoring plan's `stardf-core`
# mapping) per this lane's explicit task; the arrow workspace carries the full
# dep closure (branchless/deflate included) so this crate builds green today.
# Gates + receipts: crates/stardf-rdf-core/VENDOR-PROVENANCE.md.

[package]
name = "stardf-core"
description = "PurRDF RDF 1.2 kernel: model, diagnostics, IR, store traits, and event ingestion"
version.workspace = true
edition = "2024"
# Lane H03 gate-closure (2026-10-31): G3 fix — tier-4 closure member joins the
# publish set (was publish=false; the 21:05 ladder receipt named it).
publish = true
license = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
repository = "https://github.com/seanchatmangpt/ggen-legacy"
documentation = "https://docs.rs/purrdf-core"
rust-version = "1.98"
keywords = ["rdf", "rdf-12", "ir", "diagnostics", "linked-data"]
categories = ["parser-implementations", "encoding", "data-structures"]
# Lane 10 / H03 (2026-10-31): crates.io 10MB tarball ceiling — witnessed
# packaged at 10,760,224 B uncompressed (H03 bootstrap simulation, 22:09):
# tests/csv_differential_vectors.txt (1,504,576 B) alone crosses it. The
# vector corpus stays in-tree for `cargo test` (csv_scan_wasm + csv
# differential gates read it), excluded from the packaged crate.
exclude = ["tests/csv_differential_vectors.txt"]

[package.metadata.docs.rs]
all-features = true

[lib]
# rlib-only PyO3-free kernel. Python bindings live under
# `bindings/python`; this crate is the ring-fenced core that MUST NOT pull
# PyO3 into its dependency tree.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_core"

[dependencies]
# Branchless kernel primitives (no_std leaf, zero deps). The Eytzinger search
# module's single home: this crate re-exports it instead of carrying its own
# copy. wasm-clean.
stardf-branchless = { version = "=26.11.1", path = "../stardf-branchless" }
# The lexical layer: the one `TextOut` append target, the `IRIREF` and literal
# escapers, the RDF 1.2 term syntax and the XML reader. A leaf over
# `purrdf-hash` only, with no edge back to the core, and wasm-clean.
stardf-lex = { version = "=26.11.1", path = "../stardf-lex" }
# Zero-dependency RFC 3987 validation for canonical RDF-term targets. The IRI
# leaf has no edge back to the core, remains wasm-clean, and prevents malformed
# or relative identifiers from entering persistent PURREMB target identity.
stardf-iri = { version = "=26.11.1", path = "../stardf-iri" }
# The SEP-0009 composite-datatype value space. Blank-node labels inside a
# `cdt:List`/`cdt:Map` lexical form denote blank nodes in the enclosing
# document's scope, so the IR kernel must read that grammar to bind them (see
# `crate::cdt_blank`). The crate is a closed leaf over `purrdf-iri`/`purrdf-xsd`
# with no edge back to the core, and stays wasm-clean.
stardf-cdt = { version = "=26.11.1", path = "../stardf-cdt" }
# The correctly rounded binary64 operation layer (`purrdf_xsd::ieee`): the distance
# kernels, the PURREMB norm and the float-environment probe compute through it, so the
# workspace has one implementation of binary floating-point arithmetic, the x87's
# precision guard and subnormal scaling included. A zero-dependency leaf already in this
# crate's graph through `purrdf-cdt`, and wasm-clean.
stardf-xsd = { version = "=26.11.1", path = "../stardf-xsd" }
# Strict BCP 47 validation for canonical RDF language-tag target identities.
# The permissive RDF 1.2 ingestion protocol: this crate provides
# the `DatasetSink` adapter that folds an `RdfEventSink` event stream into a frozen
# `RdfDataset`, plus the frozen-IR-replay `FrozenDatasetSource`. The protocol crate
# is dependency-free and uses the same `MIT OR Apache-2.0 OR MulanPSL-2.0` license as this crate.
stardf-events = { version = "=26.11.1", path = "../stardf-events" }
# Fixed-key, non-cryptographic hashing for in-memory IR lookup tables
# (`purrdf_hash::fixed::FixedHasher`, re-exported as `FastHasher`). The tables
# never persist hash values and equality still resolves collisions; this replaces
# SipHash on hot value-index paths without introducing runtime randomness. A
# zero-dependency leaf, so the kernel's graph gains no third-party package.
stardf-hash = { version = "=26.11.1", path = "../stardf-hash" }
# The workspace's one first-mismatch index (`purrdf_deflate::common_prefix_len`),
# the word-parallel compare behind the pack dictionary's front coding. It is
# `#[inline]` with no dispatch, so each short record compare compiles into the
# encoder's loop. A leaf over `purrdf-hash` only, with no edge back to the
# core, and wasm-clean.
stardf-deflate = { version = "=26.11.1", path = "../stardf-deflate" }
# Raw `HashTable` for the store-once builder interner/dedup: each term/
# row is owned ONCE by its `Vec`, the table holds only indices. (`HashTable` was
# introduced in hashbrown 0.14.2; the workspace tracks 0.17.)
hashbrown = { version = "0.17", default-features = false }
# Content-addressed blob digest for the content store. Same version as the
# sibling kernel crates (logic/validate/slice). Default features (std) re-enabled;
# the workspace-level entry is default-features = false for the wasm-clean eval path.
sha2 = { version = "0.11", default-features = true }
# The execution engine `xsd_regex::compile` translates XSD/XPath regex source
# into: a DFA-based, backtracking-free, pure-Rust, wasm32-clean engine already
# proven elsewhere in this workspace (`purrdf-rdf`, `purrdf-shapes`,
# `purrdf-shex`, `purrdf-slice`, `purrdf-sparql-{algebra,eval}`). See
# `crate::xsd_regex`'s module doc for the dialect-translation rationale.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-cache", "perf-dfa", "perf-onepass", "perf-backtrack", "perf-inline"] }
# Normalized regex IR for faithful Unicode ECMA-262 pattern emission.
regex-syntax = "0.8.11"

[dev-dependencies]
# Runs the deep-structure tests on a stack of a stated size: a fresh thread
# natively, the running stack under a fresh floor on wasm32.
stardf-stack = { version = "=26.11.1", path = "../stardf-stack" }
# The workspace's shared counting allocator, for `tests/ir_zero_alloc.rs`.
# Lane H03 gate-closure (2026-10-31): dual-keyed per the G5 version+path law
# (the packaged manifest carries the version-only key). Std-only and
# dependency-free, so it needs no target gate.
stardf-alloc-probe = { version = "=26.11.1", path = "../stardf-alloc-probe" }
# Writes the built pack bytes to a real temporary file for `pack_mmap.rs` to
# read back, scratch directories for the other integration tests, and the property
# harness. Lane H03 gate-closure (2026-10-31): dual-keyed per the G5
# version+path law (the packaged manifest carries the version-only key).
stardf-testkit = { version = "=26.11.1", path = "../stardf-testkit" }

