[package]
# Vendoring lane (2026-10-31): copy-and-rename of purrdf rev
# 0da0578306983da851a9073337d57e2e2c41ab3a `crates/deflate` (see
# VENDOR-PROVENANCE.md for the per-file delta surface and sha256 receipts).
name = "stardf-deflate"
# Lane 07-publish-metadata (2026-10-31): v26.11.1 first-class closure —
# description/keywords/categories/repository workspace-inherited.
description.workspace = true
# Lane 08-dual-key (2026-10-31): closure version inherits the workspace 26.11.1.
version.workspace = true
# Upstream-true value: purrdf workspace `[workspace.package] edition = "2024"`
# (inherited upstream). Edition is per-package; the 2021 value here is the
# stardf/arrow root default, not upstream's.
edition = "2024"
publish = true
repository.workspace = true
homepage.workspace = true
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
rust-version = "1.98"
keywords.workspace = true
categories.workspace = true
# Lane 10 (2026-10-31): crates.io 10MB tarball ceiling — the frozen match-length
# vector corpus (tests/vectors, 176K) stays in-tree for the parked integration
# tests, excluded from the packaged crate (no live consumer in the package:
# tests/ holds only vectors/ + disabled/).
exclude = ["tests/vectors"]

[package.metadata.docs.rs]
all-features = true

[lib]
# rlib-only. Its one runtime dependency is purrdf-hash (the CRC-32 of the gzip
# trailer), itself zero-dependency. No threads, no filesystem, no clock and no
# entropy, so it is wasm32-clean on every target.
crate-type = ["rlib"]
path = "src/lib.rs"
# LIB NAME VERBATIM per the vendoring law (lib names, LICENSE files, in-file
# notices unchanged): this crate's source `use purrdf_hash::...` verbatim, and
# stardf-hash lands with lib name `purrdf_hash`. Only the PACKAGE name was
# renamed (purrdf-deflate -> stardf-deflate).
name = "purrdf_deflate"

[dependencies]
# Rename of the first-party dep key purrdf-hash -> stardf-hash (package-level
# rename scope). Path form per the stardf-columnar first-party dep precedent;
# stardf-hash is vendored at the same purrdf rev 0da05783 (lib `purrdf_hash`).
stardf-hash = { workspace = true }

# Upstream dev-dependencies are omitted (disclosed): `purrdf-testkit` and
# `purrdf-alloc-probe` are first-party purrdf crates NOT in this lane's
# vendoring scope and do not exist in the stardf/arrow workspace. The three
# upstream test/bench targets that require them are parked (not deleted) under
# `tests/disabled/` and `benches/disabled/` with the unpark preconditions
# recorded in the README.md inside each directory. The following upstream
# comment is retained verbatim:

# The deterministic input streams and the `harness = false` runner the
# cross-target test runs on. Path-only and unpublished, so it is stripped from
# the packaged manifest.

# The [[bench]] name = "gzip" and [[test]] name = "deflate_conformance"
# sections are removed (disclosed): their target files sit in `disabled/`
# subdirectories, which cargo auto-discovery does not scan, so the sections
# would error on a missing target path. The sections are restored verbatim
# when the targets unpark.

[lints.rust]
# Upstream declared `[lints] workspace = true` against the purrdf workspace
# tables; the stardf/arrow workspace root carries no `[workspace.lints]`, so
# the upstream tables are inlined here VERBATIM (same posture, zero drift).
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
# Underscore spelling, not `rust-2018-idioms`: cargo deprecated the dashed form
# and will stop honouring it in a future edition, at which point the whole lint
# GROUP would silently stop applying. Nightly cargo already warns about it.
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Pedantic/nursery opt-outs, each with a reason. Keep this list short and
# justified; prefer fixing code over widening it.
module_name_repetitions = "allow"     # purrdf_core::RdfDataset-style names are deliberate
missing_errors_doc = "allow"          # error semantics live on the error types themselves
missing_panics_doc = "allow"          # panics are programming errors, documented at the assert
must_use_candidate = "allow"          # blanket #[must_use] adds noise; applied by hand where it guards bugs
option_if_let_else = "allow"          # nursery: frequently less readable than the match it replaces
redundant_pub_crate = "allow"         # nursery: conflicts with unreachable_pub on binary/test targets
doc_markdown = "allow"                # 500+ backtick nits on spec terms (RDF/XML, JSON-LD); revisit with doc-valid-idents
missing_const_for_fn = "allow"        # nursery: noisy and often wrong about intentionally non-const APIs
too_long_first_doc_paragraph = "allow" # cosmetic doc layout only
cast_possible_truncation = "allow"    # u32 id/offset space is asserted at construction; casts are deliberate
cast_possible_wrap = "allow"          # ditto
cast_sign_loss = "allow"              # ditto
cast_precision_loss = "allow"         # XSD numeric promotion is spec-defined; losses are intentional
unnecessary_wraps = "allow"           # Result-shaped codec seams are kept uniform even where infallible today
unused_self = "allow"                 # method-shaped APIs kept uniform across backends
many_single_char_names = "allow"      # s/p/o/g is the canonical RDF idiom
similar_names = "allow"               # subject/predicate/object families trip this constantly
too_many_lines = "allow"              # refactors are planned work, not lint chores
single_match_else = "allow"           # stylistic; match reads better at codec branch points
match_same_arms = "allow"             # duplicate arms often document distinct spec cases
if_not_else = "allow"                 # stylistic
items_after_statements = "allow"      # test-local helpers read better in place
zero_sized_map_values = "allow"       # HashMap<K, ()> is used deliberately for entry-API patterns
unnecessary_debug_formatting = "allow" # {:?} in diagnostics is deliberate; message text is golden-locked
float_cmp = "allow"                   # XSD value-space equality is spec-exact by design
