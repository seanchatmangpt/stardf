[package]
name = "stardf-validate"
description = "PurRDF SARIF 2.1.0 reporting boundary: renders RDF diagnostics and SHACL/ShEx validation reports to source-traced, byte-deterministic SARIF — the boundary crate that keeps stardf-core structured but SARIF-free"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stardf-validate"
rust-version.workspace = true
keywords = ["sarif", "shacl", "rdf", "diagnostics", "validation"]
categories = ["encoding"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only, wasm-clean boundary crate: consumes the report/diagnostic types and
# emits SARIF JSON. NO PyO3, NO ambient I/O — so it stays
# wasm32-unknown-unknown-clean like every release crate.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_validate"

[dependencies]
# Base16 rendering and reading of the digests this crate prints and parses.
stardf-hash = { workspace = true }
# SHACL validation report types (ValidationReport / ValidationResult / Severity /
# Path) — the primary input rendered to SARIF.
stardf-shapes = { workspace = true }
# The structured, SARIF-free diagnostic + location + provenance types
# (RdfDiagnostic / RdfLocation / RdfSeverity / Attribution / UnitInterner). This
# crate is their SARIF serialization boundary (S0.5: numeric ids resolve to public
# slice IRIs here, never leak into output).
stardf-core = { workspace = true }
# The native codec surface: the opt-in SpanTable that maps a data-graph subject to
# its source position, joined here into SARIF physicalLocations.
stardf-rdf = { workspace = true }
# The shared source-position primitive (Position / LineIndex).
stardf-iri = { workspace = true }
# The native, wasm-clean entailment-regime chase plus its ReasoningReport and
# machine-readable rule inventory. `src/regime.rs` is the string boundary over it:
# it renders the report the bindings carry across their host boundaries, so this
# crate — not each binding — owns the one deterministic textual form.
stardf-entail = { workspace = true }
# The evaluation limits a materialization runs under (`EvalOptions`) and the limit
# refusals `src/regime.rs` renders in each host's own spelling.
stardf-datalog = { workspace = true }
# The evaluator's governor configuration, which `src/governors.rs` builds for every
# host from one metered base. Also the `Arity` and `Volatility` a host declaring a
# native SPARQL function names in a prepared-shapes-product restore.
stardf-sparql-eval = { workspace = true }
# The SPARQL-results provenance carrier `src/query.rs` fills.
stardf-sparql-results = { workspace = true }
# SHA-256 of the query text: the `sha256:` query identity `src/query.rs` carries.
sha2 = { workspace = true }
# The workspace's one JSON value and writer: the hand-rolled SARIF model writes
# itself as a `purrdf_lex::json::Value` and prints through `write_pretty`.
stardf-lex = { workspace = true }
# The pure geographic engine and its exact coordinate/quantity representation.
stardf-geo-kernel = { workspace = true }
stardf-xsd = { workspace = true }

[dev-dependencies]
# Runs the deep-structure tests on a stack of a stated size: a fresh thread
# natively, the running stack under a fresh floor on wasm32.
stardf-stack = { workspace = true }
stardf-testkit = { workspace = true }
stardf-alloc-probe = { workspace = true }

[[test]]
name = "dl_proof_vectors"
harness = false
