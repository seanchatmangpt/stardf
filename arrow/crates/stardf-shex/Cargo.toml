[package]
name = "stardf-shex"
description = "PurRDF ShEx 2.1 engine: ShExC/ShExJ schema parsing, structural validation, and shape-map validation over the stardf-core IR, gated against the shexTest conformance suite"
version.workspace = true
edition.workspace = true
publish = false
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stardf-shex"
rust-version.workspace = true
keywords = ["shex", "rdf", "schema", "parser", "validation"]
categories = ["parser-implementations"]

[package.metadata.docs.rs]
all-features = true

[lib]
# rlib-only, wasm-clean leaf: the ShEx 2.1 front-end of the shapes stack. The
# schema layer (ShExC/ShExJ parsers, the ShExJ-aligned AST, and the spec §5.7
# structural well-formedness checks) builds only on the CLOSED foundation
# leaves `stardf-iri` and `stardf-xsd`; the shape-map validator (`validate`)
# evaluates over the `stardf-core` frozen IR in interned `TermId` space.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_shex"

[dependencies]
stardf-hash.workspace = true
stardf-core = { workspace = true }
stardf-iri = { workspace = true }
# The RDF 1.2 term syntax and literal/IRI escapers the ShExC writer and the
# result shape map spell terms with.
stardf-lex = { workspace = true }
stardf-stack = { workspace = true }
stardf-xsd = { workspace = true }

[dev-dependencies]
stardf-alloc-probe.workspace = true
# Byte-exact golden files for the scanner boundary sweep. Path-only and
# unpublished, so it is stripped from the packaged manifest.
stardf-testkit = { workspace = true }
# Turtle parsing for the validation conformance harness only (the library
# itself depends on the ring-fenced kernel, never the codec stack).
stardf-rdf = { workspace = true }

# (lane 13, 2026-10-31) `[[test]] structured_errors` REMOVED: the target file
# is parked at tests/disabled/structured_errors.rs (upstream mid-refactor
# breakage at purrdf rev 0da05783, byte-identical, E0061 witnessed both sides;
# exact_facets.rs parked for the same reason — see tests/disabled/README.md).

[[bench]]
name = "prepared_validate"
harness = false

[[bench]]
# Per-value-node cost of the ShEx `PATTERN` facet's `PatternCache`: a shared
# valid pattern, the memoized compile-failure path, and a distinct pattern per
# shape (the cache-miss control), many nodes per validation call. Report-only;
# `make bench` lane only — excluded from `make check`.
name = "pattern_validate"
harness = false

[lints]
workspace = true
