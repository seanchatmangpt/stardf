# Vendoring lane (2026-10-31): copy-and-rename of purrdf rev
# 0da0578306983da851a9073337d57e2e2c41ab3a `crates/testkit` -> `stardf-testkit`; lib name
# `purrdf_testkit` stays VERBATIM per the vendoring law. Only the package name,
# workspace-inherited scalars (version/edition/license/repository/rust-version),
# first-party dep keys (path deps) and external pin RHS values were touched.

[package]
name = "stardf-testkit"
# Lane 07-publish-metadata (2026-10-31): v26.11.1 first-class closure —
# description/keywords/categories/repository workspace-inherited.
description.workspace = true
# Lane 08-dual-key (2026-10-31): closure version inherits the workspace 26.11.1.
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
repository.workspace = true
homepage.workspace = true
rust-version = "1.98"
keywords.workspace = true
categories.workspace = true
publish = true

# Upstream `[lints] workspace = true` inlined VERBATIM from purrdf root
# [workspace.lints] at the vendored rev (same posture, zero drift).
[lib]
# Vendoring-lane addition (disclosed): upstream purrdf-testkit declared NO
# explicit [lib] name — the lib name was IMPLICIT (package purrdf-testkit ->
# purrdf_testkit). The vendoring law renames PACKAGE names only and keeps lib
# names verbatim, so the implicit name is pinned explicitly here; consumers
# keep `use purrdf_testkit::...` (the package's own bins and integration tests
# included).
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_testkit"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
# Underscore spelling, not `rust-2018-idioms`: cargo deprecated the dashed form
# and will stop honouring it in a future edition, at which point the whole lint
# GROUP would silently stop applying. Nightly cargo already warns about it.
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Pedantic/nursery opt-outs, each with a reason. Keep this list short and
# justified; prefer fixing code over widening it.
module_name_repetitions = "allow"     # purrdf_core::RdfDataset-style names are deliberate
missing_errors_doc = "allow"          # error semantics live on the error types themselves
missing_panics_doc = "allow"          # panics are programming errors, documented at the assert
must_use_candidate = "allow"          # blanket #[must_use] adds noise; applied by hand where it guards bugs
option_if_let_else = "allow"          # nursery: frequently less readable than the match it replaces
redundant_pub_crate = "allow"         # nursery: conflicts with unreachable_pub on binary/test targets
doc_markdown = "allow"                # 500+ backtick nits on spec terms (RDF/XML, JSON-LD); revisit with doc-valid-idents
missing_const_for_fn = "allow"        # nursery: noisy and often wrong about intentionally non-const APIs
too_long_first_doc_paragraph = "allow" # cosmetic doc layout only
cast_possible_truncation = "allow"    # u32 id/offset space is asserted at construction; casts are deliberate
cast_possible_wrap = "allow"          # ditto
cast_sign_loss = "allow"              # ditto
cast_precision_loss = "allow"         # XSD numeric promotion is spec-defined; losses are intentional
unnecessary_wraps = "allow"           # Result-shaped codec seams are kept uniform even where infallible today
unused_self = "allow"                 # method-shaped APIs kept uniform across backends
many_single_char_names = "allow"      # s/p/o/g is the canonical RDF idiom
similar_names = "allow"               # subject/predicate/object families trip this constantly
too_many_lines = "allow"              # refactors are planned work, not lint chores
single_match_else = "allow"           # stylistic; match reads better at codec branch points
match_same_arms = "allow"             # duplicate arms often document distinct spec cases
if_not_else = "allow"                 # stylistic
items_after_statements = "allow"      # test-local helpers read better in place
zero_sized_map_values = "allow"       # HashMap<K, ()> is used deliberately for entry-API patterns
unnecessary_debug_formatting = "allow" # {:?} in diagnostics is deliberate; message text is golden-locked
float_cmp = "allow"                   # XSD value-space equality is spec-exact by design


# The fixture the harness oracle runs as a real child process, so the exit
# status and the exact console output are observed rather than modelled.
[[bin]]
name = "testkit-harness-fixture"
path = "src/bin/harness_fixture.rs"
test = false
doc = false

# The fixture whose cases print from inside a case, from worker threads and
# from threads a case spawns: tests/harness.rs runs it natively under a
# deadline, and scripts/check-wasm-test-runner.sh runs it on wasm32.
[[bin]]
name = "testkit-harness-print-fixture"
path = "src/bin/harness_print_fixture.rs"
test = false

# The fixture scripts/check-wasm-test-runner.sh runs on wasm32 to observe the
# runner's host seal: a clock read outside the seal passes, the same read inside
# it fails by name.
[[bin]]
name = "testkit-wasm-host-fixture"
path = "src/bin/wasm_host_fixture.rs"
test = false
doc = false

# The bench harness's own suite: statistics against hand-computed values, the
# command line, the estimates file round trip and whole runs in-process. It is
# on the shared runner; WASM selects only host-clock and storage-refusal cases.
[[test]]
name = "bench"
harness = false

[dependencies]
# The one first-party dependency (layers.toml allows no other: `purrdf-lex`'s
# tests run on this crate, so an edge to it would close a dev-dependency cycle):
# `purrdf-hash`, the zero-dependency root, whose own tests
# do not use this crate (its vector suites live in `purrdf-hash-conformance`),
# so no member's tests close a cycle through it. It supplies the SplitMix64
# function the deterministic stream is built on, and the FNV-1a hash that
# seeds each benchmark's bootstrap from its id.
stardf-hash = { workspace = true }
# SHA-256 for the frozen-vector tamper evidence.
sha2 = { version = "0.11", default-features = false }
# The parser behind `regex`: string generators walk its high-level IR, so a
# pattern means to `prop::string::regex` exactly what it means to `regex`.
regex-syntax = "0.8.11"

[dev-dependencies]
# The independent oracle for the string generators: every generated string must
# be a full match of its pattern under the `regex` crate itself.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-cache", "perf-dfa", "perf-onepass", "perf-backtrack", "perf-inline"] }

# The harness's host on wasm32-unknown-unknown, where the standard library has
# no command line, environment, console or clock: the test binary runs in Node
# under scripts/wasm-test-runner.sh, and these reach Node's `process.argv`,
# `process.env`, `console.log`/`console.error` and `Date.now`. Direct host
# imports need only the already-shared wasm-bindgen dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
