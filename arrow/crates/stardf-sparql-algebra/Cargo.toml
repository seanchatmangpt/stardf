# Vendoring lane (2026-10-31): copy-and-rename of purrdf rev
# 0da0578306983da851a9073337d57e2e2c41ab3a `crates/sparql-algebra` -> `stardf-sparql-algebra`; lib name
# `purrdf_sparql_algebra` stays VERBATIM per the vendoring law. Only the package name,
# workspace-inherited scalars (version/edition/license/repository/rust-version),
# first-party dep keys (path deps) and external pin RHS values were touched.

[package]
name = "stardf-sparql-algebra"
description = "Native, wasm-clean SPARQL 1.1/1.2 parser → RDF 1.2-native query algebra AST (quoted triple terms, property paths, FILTER/BIND/VALUES, solution modifiers, GROUP BY) for the RDF 1.2 query stack"
version.workspace = true
edition = "2024"
# Lane H03 gate-closure (2026-10-31): G3 fix — tier-4 closure member joins the
# publish set (was publish=false; the 21:05 ladder receipt named it).
publish = true
repository = "https://github.com/seanchatmangpt/ggen-legacy"
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
rust-version = "1.98"
keywords = ["sparql", "rdf", "rdf-12", "algebra", "parser"]
categories = ["parser-implementations", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lib]
# rlib-only, wasm-clean leaf: the SPARQL front-end of the native query stack. It
# builds on the foundation leaves `purrdf-lex`, `purrdf-iri` and
# `purrdf-xsd`; it deliberately does NOT depend on `purrdf-core`
# (whose terms are dataset-interned `TermId` and which pulls a `gts` default feature).
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_sparql_algebra"

[dependencies]
# Lane H03 gate-closure (2026-10-31): all first-party dep rows dual-keyed per
# the G5 version+path law (the 21:05 ladder receipt named these rows); the
# packaged manifest carries the version-only keys.
stardf-iri = { version = "=26.11.1", path = "../stardf-iri" }
stardf-xsd = { version = "=26.11.1", path = "../stardf-xsd" }
# The SEP-0009 composite datatypes (`cdt:List` / `cdt:Map`): the closed function
# registry (`CdtFn`, `CdtArity`) this parser resolves a call-position CDT IRI
# against, and the lexical layer a `"…"^^cdt:List` literal is checked with. A
# closed leaf over `purrdf-iri` + `purrdf-xsd` only, so it adds no edge this
# crate does not already carry and keeps the front-end `purrdf-core`-free.
stardf-cdt = { version = "=26.11.1", path = "../stardf-cdt" }
# The fixed-key table hasher behind the parser's prefix and blank-label maps:
# their iteration order is the same on every run.
stardf-hash = { version = "=26.11.1", path = "../stardf-hash" }
# The lexical layer: terminals, escape decoders and the chunked byte scans on
# the tokenizer hot paths (string-literal body, IRIREF end, comment/EOL).
stardf-lex = { version = "=26.11.1", path = "../stardf-lex" }

[dev-dependencies]
# Runs the deep-structure tests on a stack of a stated size: a fresh thread
# natively, the running stack under a fresh floor on wasm32.
stardf-stack = { version = "=26.11.1", path = "../stardf-stack" }
# Byte-exact golden files for the algebra snapshots, and the property harness
# (lexer round-trips, parser robustness). Dual-keyed per the G5 version+path
# law; the packaged manifest carries the version-only key.
stardf-testkit = { version = "=26.11.1", path = "../stardf-testkit" }
# Text extraction for `tests/shipped_sparql_examples.rs` — the gate that pulls
# SPARQL query/update text and `AGG(<iri>...)` call fragments out of the book,
# `--help` text, `.pyi`, `.d.ts`, and rustdoc, and parses each with THIS crate's
# own parser. Dev-only: never a runtime or release dependency, so the wasm gate
# is unaffected.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-cache", "perf-dfa", "perf-onepass", "perf-backtrack", "perf-inline"] }
# The counting allocator `tests/chain_parse_is_linear.rs` measures a chain's parse
# with. Dual-keyed per the G5 version+path law; the packaged manifest carries
# the version-only key.
stardf-alloc-probe = { version = "=26.11.1", path = "../stardf-alloc-probe" }

[[bench]]
name = "tokenize"
harness = false
#
[[bench]]
name = "scope_checks"
harness = false
#
[[test]]
name = "scope_candidates"
harness = false
#
[[test]]
name = "lexer_owned_admission"
harness = false
#
[[bench]]
name = "tokenize_values"
harness = false
#
[[bench]]
name = "update_reparse"
harness = false
#
[[bench]]
# # Clone, Drop, `==`, Hash, Debug and the serializer over parsed algebra trees:
# # deep ones (an OPTIONAL spine, nested calls, nested groups) and wide ones (a
# # 4 096-pattern BGP, 1 024 UNION arms, a 4 096-row VALUES). Report-only; `make
# # bench` lane only — excluded from `make check`.
name = "algebra_walks"
harness = false
#
[[bench]]
# # Parse throughput over thirty embedded, realistic queries spanning the four
# # query forms, joins, OPTIONAL/UNION/MINUS/GRAPH, FILTER built-ins, paths,
# # aggregates, sub-SELECTs, RDF 1.2 triple terms and LATERAL — the whole set and
# # each query alone. Report-only; `make bench` lane only — excluded from `make
# # check`.
name = "parse"
harness = false
#
# # Upstream `[lints] workspace = true` inlined VERBATIM from purrdf root
# # [workspace.lints] at the vendored rev (same posture, zero drift).
# [lints.rust]
# missing_docs = "warn"
# unsafe_op_in_unsafe_fn = "warn"
# missing_debug_implementations = "warn"
# unreachable_pub = "warn"
# unused_qualifications = "warn"
# # Underscore spelling, not `rust-2018-idioms`: cargo deprecated the dashed form
# # and will stop honouring it in a future edition, at which point the whole lint
# # GROUP would silently stop applying. Nightly cargo already warns about it.
# rust_2018_idioms = { level = "warn", priority = -1 }
#
# [lints.clippy]
# all = { level = "warn", priority = -1 }
# pedantic = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }
# # Pedantic/nursery opt-outs, each with a reason. Keep this list short and
# # justified; prefer fixing code over widening it.
# module_name_repetitions = "allow"     # purrdf_core::RdfDataset-style names are deliberate
# missing_errors_doc = "allow"          # error semantics live on the error types themselves
# missing_panics_doc = "allow"          # panics are programming errors, documented at the assert
# must_use_candidate = "allow"          # blanket #[must_use] adds noise; applied by hand where it guards bugs
# option_if_let_else = "allow"          # nursery: frequently less readable than the match it replaces
# redundant_pub_crate = "allow"         # nursery: conflicts with unreachable_pub on binary/test targets
# doc_markdown = "allow"                # 500+ backtick nits on spec terms (RDF/XML, JSON-LD); revisit with doc-valid-idents
# missing_const_for_fn = "allow"        # nursery: noisy and often wrong about intentionally non-const APIs
# too_long_first_doc_paragraph = "allow" # cosmetic doc layout only
# cast_possible_truncation = "allow"    # u32 id/offset space is asserted at construction; casts are deliberate
# cast_possible_wrap = "allow"          # ditto
# cast_sign_loss = "allow"              # ditto
# cast_precision_loss = "allow"         # XSD numeric promotion is spec-defined; losses are intentional
# unnecessary_wraps = "allow"           # Result-shaped codec seams are kept uniform even where infallible today
# unused_self = "allow"                 # method-shaped APIs kept uniform across backends
# many_single_char_names = "allow"      # s/p/o/g is the canonical RDF idiom
# similar_names = "allow"               # subject/predicate/object families trip this constantly
# too_many_lines = "allow"              # refactors are planned work, not lint chores
# single_match_else = "allow"           # stylistic; match reads better at codec branch points
# match_same_arms = "allow"             # duplicate arms often document distinct spec cases
# if_not_else = "allow"                 # stylistic
# items_after_statements = "allow"      # test-local helpers read better in place
# zero_sized_map_values = "allow"       # HashMap<K, ()> is used deliberately for entry-API patterns
# unnecessary_debug_formatting = "allow" # {:?} in diagnostics is deliberate; message text is golden-locked
# float_cmp = "allow"                   # XSD value-space equality is spec-exact by design
#
