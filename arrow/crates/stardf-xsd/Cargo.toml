[package]
# Vendoring lane (2026-10-31): vendored from PurRDF `crates/xsd` at rev
# 0da05783. Sources byte-verbatim (verified per-file against
# `git archive 0da05783 crates/xsd/src`); gates + disclosed divergences in
# VENDOR-PROVENANCE.md.
name = "stardf-xsd"
# Lane 07-publish-metadata (2026-10-31): v26.11.1 first-class closure —
# description/keywords/categories/repository now workspace-inherited (upstream
# per-crate values retired per the unified closure-metadata dispatch).
description.workspace = true
# Lane 08-dual-key (2026-10-31): closure version inherits the workspace 26.11.1.
version.workspace = true
# Upstream edition carried verbatim (2024): the vendored sources use
# edition-2024 semantics; disclosed in VENDOR-PROVENANCE.md (workspace default
# is 2021; member-level override).
edition = "2024"
publish = true
license = "MIT OR Apache-2.0 OR MulanPSL-2.0"
repository.workspace = true
homepage.workspace = true
rust-version = "1.98"
keywords.workspace = true
categories.workspace = true
# Lane 10 (2026-10-31): crates.io 10MB tarball ceiling — the frozen conformance
# vector corpus under tests/vectors (34.4MB: rfc3339_vectors 24MB, wide/binary_
# decimal/gcd/exact_numeric/calendar vectors) stays in-tree for `cargo test`,
# excluded from the packaged crate. tests/disabled/ (324K) still rides.
exclude = ["tests/vectors"]

[lib]
# LIB NAME VERBATIM per the vendoring law (lib names, LICENSE files, in-file
# notices unchanged): consumers `use purrdf_xsd::...` in the stardf tree.
# Only the PACKAGE name was renamed (purrdf-xsd -> stardf-xsd). Same posture
# as stardf-hash's `purrdf_hash` / stardf-lex's `purrdf_lex`.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_xsd"

[dependencies]
# The base16 codec, structured-error protocol, SplitMix64, Domain separators
# and vector-ISA dispatcher (upstream key purrdf-hash, renamed per the
# vendoring law; resolves to package stardf-hash, vendored this workspace,
# lib name stays purrdf_hash).
stardf-hash = { workspace = true }
# The allocation layer, byte-run scanner, walks, XML 1.1 tables, JSON number
# lexeme layer, diagnostic vocabulary and error/constructor macros (upstream
# key purrdf-lex; resolves to package stardf-lex, vendored this workspace,
# lib name stays purrdf_lex).
stardf-lex = { workspace = true }

[dev-dependencies]
# The shared property/rng harness and the counting allocator the lib unit
# tests hold each cost estimate's byte bound to (upstream keys purrdf-testkit
# / purrdf-alloc-probe; both vendored this workspace). Parked-target note:
# the integration tests, benches and the vector generator example that also
# consume these are PARKED under tests|benches|examples/disabled/ (see the
# READMEs there).
# PARKED-DEVDEP note (cross-lane, 2026-10-31): the upstream integration
# tests/benches/example that ALSO consume these are parked under
# tests|benches|examples/disabled/ (see the READMEs there); these two
# dev-dependencies are kept DECLARED because the LIB UNIT TESTS (live, run by
# `cargo test -p stardf-xsd --lib`) consume them — the counting-allocator
# bounds in src/bigint and the SplitMix64-driven property tests. Both
# substrate crates are workspace members (stardf-testkit,
# stardf-alloc-probe), so the unit tests stay real, not gated-inert.
# Lane H03 gate-closure (2026-10-31): both dev-deps dual-keyed per the G5
# version+path law (the 21:05 ladder receipt named these rows); the packaged
# manifest now carries the version-only keys.
purrdf-testkit = { package = "stardf-testkit", version = "=26.11.1", path = "../stardf-testkit" }
purrdf-alloc-probe = { package = "stardf-alloc-probe", version = "=26.11.1", path = "../stardf-alloc-probe" }

[lints.rust]
# Inlined from upstream [workspace.lints.rust] (this workspace carries no
# [workspace.lints]; disclosed in VENDOR-PROVENANCE.md) so the vendored code
# lints exactly as it does upstream.
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
# Underscore spelling, not `rust-2018-idioms`: cargo deprecated the dashed form
# and will stop honouring it in a future edition, at which point the whole lint
# GROUP would silently stop applying. Nightly cargo already warns about it.
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# Inlined from upstream [workspace.lints.clippy], verbatim including opt-outs,
# so the vendored code lints exactly as it does upstream.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"     # purrdf_core::RdfDataset-style names are deliberate
missing_errors_doc = "allow"          # error semantics live on the error types themselves
missing_panics_doc = "allow"          # panics are programming errors, documented at the assert
must_use_candidate = "allow"          # blanket #[must_use] adds noise; applied by hand where it guards bugs
option_if_let_else = "allow"          # nursery: frequently less readable than the match it replaces
redundant_pub_crate = "allow"         # nursery: conflicts with unreachable_pub on binary/test targets
doc_markdown = "allow"                # 500+ backtick nits on spec terms (RDF/XML, JSON-LD); revisit with doc-valid-idents
missing_const_for_fn = "allow"        # nursery: noisy and often wrong about intentionally non-const APIs
too_long_first_doc_paragraph = "allow" # cosmetic doc layout only
cast_possible_truncation = "allow"    # u32 id/offset space is asserted at construction; casts are deliberate
cast_possible_wrap = "allow"          # ditto
cast_sign_loss = "allow"              # ditto
cast_precision_loss = "allow"         # XSD numeric promotion is spec-defined; losses are intentional
unnecessary_wraps = "allow"           # Result-shaped codec seams are kept uniform even where infallible today
unused_self = "allow"                 # method-shaped APIs kept uniform across backends
many_single_char_names = "allow"      # s/p/o/g is the canonical RDF idiom
similar_names = "allow"               # subject/predicate/object families trip this constantly
too_many_lines = "allow"              # refactors are planned work, not lint chores
single_match_else = "allow"           # stylistic; match reads better at codec branch points
match_same_arms = "allow"             # duplicate arms often document distinct spec cases
if_not_else = "allow"                 # stylistic
items_after_statements = "allow"      # test-local helpers read better in place
zero_sized_map_values = "allow"       # HashMap<K, ()> is used deliberately for entry-API patterns
unnecessary_debug_formatting = "allow" # {:?} in diagnostics is deliberate; message text is golden-locked
float_cmp = "allow"                   # XSD value-space equality is spec-exact by design
